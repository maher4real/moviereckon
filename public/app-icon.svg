<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MovieReckon app icon</title>
  <desc id="desc">A dark cinematic icon with the MovieReckon gradient film-strip brand mark.</desc>
  <defs>
    <linearGradient id="brand" x1="258" y1="210" x2="768" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e1122d" />
      <stop offset="0.46" stop-color="#f15a24" />
      <stop offset="1" stop-color="#a96700" />
    </linearGradient>
    <radialGradient id="warmGlow" cx="34%" cy="24%" r="78%">
      <stop offset="0" stop-color="#e1122d" stop-opacity="0.34" />
      <stop offset="0.48" stop-color="#f15a24" stop-opacity="0.15" />
      <stop offset="1" stop-color="#090706" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#3a1200" flood-opacity="0.42" />
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#f15a24" flood-opacity="0.34" />
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#090706" />
  <rect width="1024" height="1024" fill="url(#warmGlow)" />
  <g transform="translate(192 192) scale(26.6667)" fill="none" stroke="url(#brand)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.85" filter="url(#glow)">
    <rect x="3" y="3" width="18" height="18" rx="2" />
    <path d="M7 3v18" />
    <path d="M17 3v18" />
    <path d="M3 7.5h4" />
    <path d="M17 7.5h4" />
    <path d="M3 12h18" />
    <path d="M3 16.5h4" />
    <path d="M17 16.5h4" />
  </g>
</svg>
